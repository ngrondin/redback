<rb-icon
    *ngIf="showicon && modes.length <= 1"
    [class]="'rb-input-icon'"
    [icon]="icon">
</rb-icon>
<rb-iconbutton
    #modeselectorbutton
    *ngIf="modes.length > 1"
    class="rb-input-trail-iconbutton"
    [icon]="'apps'"
    [style.color]="'var(--light-writing-color)'"
    (click)="openModeSelector()">
</rb-iconbutton>
<div
    *ngIf="showsearchfield"
    class="rb-input-container">
    <span
        [class]="'rb-input-label' + ((displayvalue === null || displayvalue === '' || displayvalue === undefined) && !isEditing ? ' rb-input-label-big' : '')">
        {{label}}
    </span>
    <div
       class="rb-input-row">
      <input
          #input
          [class]="'rb-input-input rb-input-text-color' + (flasherOn ? ' rb-input-text-flash' : '')"
          [(ngModel)]="displayvalue"
          (focus)="onFocus($event)"
          (blur)="onBlur($event)"
          (keydown)="onKeydown($event)"
          (keyup)="onKeyup($event)"
          [readonly]="readonly"
          autocomplete="off"
          [type]="'text'">
      </div>
    <div
        [class]="'rb-input-underline' + (isEditing ? ' rb-input-underline-editing' : '')">
    </div>
</div>
<rb-iconbutton
    *ngIf="mode.filterconfig != null"
    [class]="'rb-input-trail-iconbutton ' + (hasFilter ? ' rb-search-filterbutton-active' : ' rb-search-filterbutton')"
    [icon]="'filter_list'"
    (click)="openFilterBuilder()">
</rb-iconbutton>
