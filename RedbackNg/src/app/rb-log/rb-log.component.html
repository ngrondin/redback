<div
    class="rb-log-post"
    *ngIf="isEditable">
    <rb-textarea-input
        [label]="'New Note'"
        [icon]="'create'"
        [size]="40"
        [margin]="false"
        [rows]="2"
        [(value)]="value"
        (keydown)="keydown($event)">
    </rb-textarea-input>
    <rb-button
        [label]="'Post'"
        [focus]="true"
        (click)="post()">
    </rb-button>
</div>
<div
    class="rb-log-container hscroll"
    (scroll)="onScroll($event)">
    <div 
        *ngFor="let grp of groups"
        [class]="'rb-log-group'">
        <span
            *ngIf="grp != 'null'"
            class="rb-log-group-label">
            &nbsp;{{grp}}
        </span>
        <div
            [class]="'rb-log-card' + (canClick ? ' rb-log-card-active' : '')"
            *ngFor="let item of data[grp]"
            (click)="clickCard(item.object)">
            <div
                class="rb-log-header">
                <div
                    class="rb-log-name">
                    {{item.user}}
                </div>
                <div
                    class="rb-log-date">
                    {{item.date}}
                </div>
            </div>
            <div
                class="rb-log-bodyrow">
                <div
                    class="rb-log-bodycol">
                    <div
                        class="rb-log-entry"
                        [innerHTML]="item.entry">
                    </div>
                    <div
                        *ngIf="item.category != null"
                        class="rb-log-category">
                        {{item.category}}
                    </div>                
                </div>
                <div
                    *ngIf="isEditable && item.object.canDelete()"
                    class="rb-log-options">
                    <rb-iconbutton
                        *ngIf="item.object.canDelete()"
                        [icon]="'close_small'"
                        (click)="deleteItem(item.object)">
                    </rb-iconbutton>    
                </div>
            </div>
        </div >
    </div>
    
</div>
